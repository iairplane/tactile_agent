[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demo2gripper"
version = "0.1.0"
description = "Object-centric human demonstration to parallel-jaw grasp pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.8",
]
mesh = [
    "trimesh>=4.5",
]
visualization = [
    "opencv-python>=4.8,<5",
]
live = [
    "numpy>=1.26,<1.27",
    "scipy>=1.11,<1.16",
    "opencv-python>=4.8,<4.12",
    "pyrealsense2>=2.56,<3",
    "pyserial>=3.5,<4",
]

[project.scripts]
demo2gripper = "demo2gripper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
